<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json?v=2">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="referrer" content="no-referrer">
<title>舞蹈課表與路線規劃</title>
<style>
:root{
  color-scheme:light;
  --background:#ffffff; --foreground:#111827; --card:#ffffff; --card-foreground:#111827;
  --muted:#f3f4f6; --muted-foreground:#6b7280; --primary:#2563eb; --primary-foreground:#ffffff;
  --secondary:#f8fafc; --secondary-foreground:#111827; --accent:#eff6ff; --accent-foreground:#1d4ed8;
  --border:#d1d5db; --input:#d1d5db; --ring:#60a5fa; --green:#15803d; --orange:#c2410c; --red:#dc2626;
  --viz-series-1:#2563eb; --viz-series-2:#0f766e; --viz-series-3:#7c3aed; --viz-series-4:#be123c; --viz-series-5:#0369a1; --viz-series-6:#a16207;
  --radius:12px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--background);color:var(--foreground)}
body{padding:1rem;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.5rem .75rem;border:1px solid var(--border);border-radius:9px;background:var(--secondary);color:var(--secondary-foreground);text-decoration:none;cursor:pointer}
.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.form-label{display:block;margin-bottom:.25rem;font-size:.88rem;color:var(--muted-foreground)}
.form-select,.form-control{width:100%;padding:.5rem .6rem;border:1px solid var(--input);border-radius:9px;background:var(--background);color:var(--foreground)}
.form-check{display:flex;align-items:center;gap:.45rem}
.form-check-input{width:1.1rem;height:1.1rem}
.form-check-label{font-size:.92rem}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:.5rem .4rem;border-bottom:1px solid var(--border);text-align:left}.table-responsive{overflow-x:auto}
.text-small{font-size:.82rem}.text-muted{color:var(--muted-foreground)}.text-end{text-align:right}.tabular-nums{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media(max-width:620px){body{padding:.65rem}}
</style>
</head>
<body>
<div id="dance-planner-root">
  <style>
#dance-planner-root { max-width: 1024px; }
    #dance-planner-root .dp-hero { display:grid; gap:.5rem; margin-bottom:1rem; }
    #dance-planner-root .dp-kicker { color:var(--muted-foreground); }
    #dance-planner-root .dp-controls { display:flex; flex-wrap:wrap; gap:.4rem; margin:.75rem 0 1rem; }
    #dance-planner-root .dp-day { flex:0 0 auto; }
    #dance-planner-root .dp-slot { display:grid; grid-template-columns:88px minmax(0,1fr); gap:.75rem; padding:.85rem 0; border-top:1px solid var(--border); }
    #dance-planner-root .dp-slot-time { font-weight:500; white-space:nowrap; }
    #dance-planner-root .dp-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.65rem; }
    #dance-planner-root .dp-course { position:relative; width:100%; text-align:left; padding:.75rem .8rem .75rem 1rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); color:var(--card-foreground); }
    #dance-planner-root .dp-course::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--venue-color); border-radius:var(--radius) 0 0 var(--radius); }
    #dance-planner-root .dp-course[aria-pressed="true"] { box-shadow:0 0 0 2px var(--ring); }
    #dance-planner-root .dp-course-title { display:flex; justify-content:space-between; gap:.5rem; align-items:baseline; }
    #dance-planner-root .dp-classes { display:grid; gap:.2rem; margin-top:.45rem; }
    #dance-planner-root .dp-class { display:flex; justify-content:space-between; gap:.6rem; }
    #dance-planner-root .dp-next { margin-top:1rem; }
    #dance-planner-root .dp-venues { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.75rem; margin:1rem 0; }
    #dance-planner-root .dp-matrix { margin-top:1rem; }
    #dance-planner-root .v-huk-hx { --venue-color:var(--viz-series-1); }
    #dance-planner-root .v-huk-sm { --venue-color:var(--viz-series-2); }
    #dance-planner-root .v-bad { --venue-color:var(--viz-series-3); }
    #dance-planner-root .v-odog { --venue-color:var(--viz-series-4); }
    #dance-planner-root .dp-route { padding:1rem; margin:0 0 1rem; }
    #dance-planner-root .dp-route-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.65rem; }
    #dance-planner-root .dp-route-stop { display:grid; grid-template-columns:minmax(150px,1fr) auto auto auto; align-items:center; gap:.5rem; margin-top:.5rem; }
    #dance-planner-root .dp-route-time-field { display:flex; align-items:center; gap:.3rem; color:var(--muted-foreground); white-space:nowrap; }
    #dance-planner-root .dp-route-time-field input { width:4.5rem; }
    #dance-planner-root .dp-route-actions { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; margin-top:.75rem; }
    #dance-planner-root .dp-route-result { margin-top:.9rem; }
    #dance-planner-root .dp-route-map { margin-top:.85rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--muted); overflow:hidden; }
    #dance-planner-root .dp-map-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; padding:.55rem; border-bottom:1px solid var(--border); }
    #dance-planner-root .dp-map-mode { display:flex; flex-wrap:wrap; align-items:end; gap:.5rem; width:100%; }
    #dance-planner-root .dp-map-mode .form-select { min-width:150px; }
    #dance-planner-root .dp-segment-controls { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; }

    #dance-planner-root .dp-map-toolbar select { min-width:190px; }
    #dance-planner-root .dp-map-open { margin-left:auto; }
    #dance-planner-root .dp-map-baidu { display:block; width:100%; height:460px; background:var(--muted); }
    #dance-planner-root .dp-map-steps { padding:.65rem; border-top:1px solid var(--border); }
    #dance-planner-root .dp-map-all { display:grid; gap:.85rem; padding:.65rem; border-top:1px solid var(--border); }
    #dance-planner-root .dp-map-all-leg { display:grid; gap:.4rem; padding-bottom:.85rem; border-bottom:1px solid var(--border); }
    #dance-planner-root .dp-map-all-leg:last-child { padding-bottom:0; border-bottom:0; }
    #dance-planner-root .dp-map-all-leg img { display:block; width:100%; height:auto; }
    #dance-planner-root .dp-step-list { margin:.4rem 0 0; padding-left:1.25rem; }
    #dance-planner-root .dp-map-fallback { border-top:1px solid var(--border); }
    #dance-planner-root .dp-map-fallback summary { padding:.55rem .65rem; }
    #dance-planner-root .dp-route-map svg { display:block; width:100%; height:auto; }
    #dance-planner-root .dp-route-map-note { padding:.4rem .6rem; border-top:1px solid var(--border); }
    #dance-planner-root .dp-route-status { font-weight:500; }
    #dance-planner-root .dp-route-status.is-ok { color:var(--green); }
    #dance-planner-root .dp-route-status.is-warn { color:var(--orange); }
    #dance-planner-root .dp-route-status.is-bad { color:var(--red); }
    #dance-planner-root .dp-route-timeline { list-style:none; padding:0; margin:.65rem 0 0; display:grid; gap:.4rem; }
    #dance-planner-root .dp-route-leg { display:flex; justify-content:space-between; gap:.75rem; padding-left:.75rem; border-left:2px solid var(--venue-color,var(--border)); }
    #dance-planner-root .dp-work { padding:1rem; margin:0 0 1rem; }
    #dance-planner-root .dp-work-head { display:flex; flex-wrap:wrap; align-items:end; gap:.6rem; margin-bottom:.75rem; }
    #dance-planner-root .dp-work-head h3 { margin:0 auto 0 0; }
    #dance-planner-root .dp-work-section { margin-top:.75rem; }
    #dance-planner-root .dp-work-section-title { margin:0 0 .45rem; font-weight:500; }
    #dance-planner-root .v-must { --venue-color:var(--orange); border-color:var(--orange); }

    #dance-planner-root .v-work { --venue-color:var(--viz-series-5); }
    #dance-planner-root .dp-daily { padding:1rem; margin:0 0 1rem; }
    #dance-planner-root .dp-daily-head { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin-bottom:.7rem; }
    #dance-planner-root .dp-daily-head h3 { margin:0 auto 0 0; }
    #dance-planner-root .dp-daily-list { display:grid; gap:.55rem; }
    #dance-planner-root .dp-daily-item { padding:.65rem .75rem; border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:var(--radius); background:var(--card); }
    #dance-planner-root .dp-daily-title { display:flex; justify-content:space-between; gap:.6rem; align-items:baseline; }
    #dance-planner-root .dp-daily-status.is-ok { color:var(--green); }
    #dance-planner-root .dp-daily-status.is-bad { color:var(--red); }
    @media (max-width:620px) {
      #dance-planner-root { max-width:100%; }
      #dance-planner-root .dp-controls { position:sticky; top:0; z-index:3; display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; padding:.45rem 0; background:var(--background); }
      #dance-planner-root .dp-controls .btn { width:100%; min-height:44px; padding:.35rem .2rem; }
      #dance-planner-root .dp-slot { grid-template-columns:1fr; gap:.35rem; }
      #dance-planner-root .dp-slot-time { color:var(--muted-foreground); }
      #dance-planner-root .dp-cards, #dance-planner-root .dp-venues, #dance-planner-root .dp-route-grid { grid-template-columns:1fr; }
      #dance-planner-root .dp-course { padding:.8rem .85rem .8rem 1rem; }
      #dance-planner-root select, #dance-planner-root input, #dance-planner-root button { min-height:44px; }
      #dance-planner-root .dp-route { padding:.85rem; }
      #dance-planner-root .dp-route-stop { grid-template-columns:1fr 1fr; gap:.55rem; padding:.65rem 0; border-top:1px solid var(--border); }
      #dance-planner-root .dp-route-stop > select { grid-column:1 / -1; }
      #dance-planner-root .dp-route-time-field { justify-content:space-between; min-height:44px; }
      #dance-planner-root .dp-route-time-field input { width:6rem; }
      #dance-planner-root .dp-route-stop > button { grid-column:1 / -1; }
      #dance-planner-root .dp-route-actions { display:grid; grid-template-columns:1fr 1fr; }
      #dance-planner-root .dp-route-actions .btn, #dance-planner-root .dp-route-actions .form-check { width:100%; min-height:44px; margin:0; }
      #dance-planner-root .dp-route-leg { display:grid; gap:.18rem; }
      #dance-planner-root .dp-route-map { overflow:hidden; }
      #dance-planner-root .dp-map-toolbar { align-items:stretch; }
      #dance-planner-root .dp-map-toolbar label, #dance-planner-root .dp-map-toolbar select, #dance-planner-root .dp-map-open { width:100%; }
      #dance-planner-root .dp-map-open { margin-left:0; }
      #dance-planner-root .dp-map-fallback { overflow-x:auto; -webkit-overflow-scrolling:touch; }
      #dance-planner-root .dp-map-fallback svg { min-width:560px; }
      #dance-planner-root .dp-matrix .table { min-width:520px; }
    }
  </style>

  <div class="dp-hero">
    <div class="dp-kicker">起點：廣廈新村 C 片 · 電動車最高時速 20 km/h · 通勤時間已含約 4 分鐘停車找教室</div>
    <div class="dp-controls" role="group" aria-label="選擇星期"></div>
  </div>

  <section class="card dp-route">
    <h3 style="margin-top:0">總路線規劃</h3>
    <div class="dp-route-grid">
      <div>
        <label class="form-label" for="dp-route-start">起點</label>
        <select id="dp-route-start" class="form-select"></select>
      </div>
      <div>
        <label class="form-label" for="dp-route-start-time">出發時間</label>
        <input id="dp-route-start-time" class="form-control" type="time" value="18:00">
      </div>
      <div>
        <label class="form-label" for="dp-route-deadline">最遲到達／返回時間</label>
        <input id="dp-route-deadline" class="form-control" type="time" value="21:30">
      </div>
    </div>
    <div id="dp-route-stops"></div>
    <div class="dp-route-actions">
      <button id="dp-route-add" type="button" class="btn">新增停靠點</button>
      <button id="dp-route-clear" type="button" class="btn">清空軌跡</button>
      <label class="form-check"><input id="dp-route-return" class="form-check-input" type="checkbox" checked><span class="form-check-label">最後返回起點</span></label>
    </div>
    <div id="dp-route-result" class="dp-route-result" aria-live="polite"></div>
  </section>

  <section class="card dp-work">
    <div class="dp-work-head">
      <h3>工作與教課日程</h3>
      <div><label class="form-label" for="dp-work-date">查看日期</label><input id="dp-work-date" class="form-control" type="date" value="2026-09-26"></div>
      <label class="btn">匯入最新 JSON<input id="dp-work-import" type="file" accept=".json,application/json" hidden></label>
    </div>
    <div class="dp-work-section"><div class="dp-work-section-title">必去工作（褐色／隊訓）</div><div id="dp-mandatory-list" class="dp-cards"></div></div>
    <div class="dp-work-section"><div class="dp-work-section-title">其他工作與安排</div><div id="dp-work-list" class="dp-cards"></div></div>
  </section>

  <section class="card dp-daily" aria-live="polite">
    <div class="dp-daily-head">
      <h3>本次當天行程</h3>
      <button id="dp-daily-image" type="button" class="btn btn-primary">輸出圖片</button>
      <button id="dp-daily-print" type="button" class="btn">列印</button>
      <button id="dp-daily-export" type="button" class="btn">另存當天行程</button>
    </div>
    <div id="dp-daily-list" class="dp-daily-list"></div>
  </section>

  <div id="dp-schedule" aria-live="polite"></div>
  <div id="dp-next" class="dp-next"></div>

  <h3 style="margin-top:1.25rem">各機構交通時間</h3>
  <div id="dp-venues" class="dp-venues"></div>

  <div class="dp-matrix">
    <h3>轉場時間</h3>
    <div class="table-responsive">
      <table class="table table-sm">
        <thead><tr><th>起點</th><th>終點</th><th class="text-end">距離</th><th class="text-end">建議預留</th></tr></thead>
        <tbody id="dp-matrix-body"></tbody>
      </table>
    </div>
  </div>

  <p class="text-small text-muted" style="margin-top:1rem">課表由海報 OCR 整理，少量圖形化文字可能誤認；標示「待核對」者請以原海報為準。O-DOG 海報為指定日期與國慶集訓，未混入每週課表。</p>
</div>

  function renderRouteStops() {
    const host = root.querySelector("#dp-route-stops");

  function renderRouteMap(sequence, legs) {
    const unique = sequence.filter(function (loc, index, all) { return all.indexOf(loc) === index; });
    const xs = unique.map(function (loc) { return mapPoints[loc].x; });
    const ys = unique.map(function (loc) { return mapPoints[loc].y; });
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const width = 760, height = 320, pad = 62;
    const spanX = maxX - minX || 1, spanY = maxY - minY || 1;
    const scale = Math.min((width - pad * 2) / spanX, (height - pad * 2) / spanY);
    const contentW = spanX * scale, contentH = spanY * scale;
    const offsetX = (width - contentW) / 2, offsetY = (height - contentH) / 2;
    const points = {};
    unique.forEach(function (loc) {
      points[loc] = {
        x: offsetX + (mapPoints[loc].x - minX) * scale,
        y: offsetY + (maxY - mapPoints[loc].y) * scale
      };
    });
    const offsets = {
      "家": {dx:0, dy:20}, "HUK 河西店": {dx:0, dy:-14}, "HUK 世茂店": {dx:0, dy:-14},
      "BAD EGGS": {dx:0, dy:22}, "O-DOG": {dx:0, dy:22}
    };
    const paths = [];
    const labels = [];
    legs.forEach(function (leg, index) {
      const a = points[leg.from], b = points[leg.to];
      if (a && b && (a.x !== b.x || a.y !== b.y)) {
        paths.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#dp-arrow)"/>`);
        labels.push(`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-7}" text-anchor="middle" font-size="12" fill="var(--foreground)" paint-order="stroke" stroke="var(--muted)" stroke-width="4" stroke-linejoin="round">${leg.min}分</text>`);
      }
    });
    const nodes = sequence.map(function (loc, index) {
      const pt = points[loc];
      return `<circle cx="${pt.x}" cy="${pt.y}" r="${index===0 ? 8 : 7}" fill="var(--venue-color,var(--primary))" stroke="var(--card)" stroke-width="3"><title>${esc(loc)}${index ? "，第 " + (index + 1) + " 站" : "，起點"}</title></circle>`;
    }).join("");
    const names = unique.map(function (loc) {
      const pt = points[loc], off = offsets[loc] || {dx:0, dy:-14};
      return `<text x="${pt.x+off.dx}" y="${pt.y+off.dy}" text-anchor="middle" font-size="12" font-weight="500" fill="var(--foreground)" paint-order="stroke" stroke="var(--muted)" stroke-width="4" stroke-linejoin="round">${esc(loc)}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="路線位置圖">
      <defs>
        <pattern id="dp-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--border)" stroke-width="1" opacity=".45"/></pattern>
        <marker id="dp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--primary)"/></marker>
      </defs>
      <rect x="0" y="0" width="${width}" height="${height}" fill="url(#dp-grid)"/>
      ${paths.join("")}${nodes}${labels.join("")}${names}
    </svg>`;
  }

  function renderRoutePlan() {

    }).join("");

      <div class="text-small text-muted" style="margin-top:.25rem">移動 ${travelMin} 分 · 上課與拖堂 ${classMin} 分 · 總計 ${totalMin} 分 · 總距離約 ${totalKm.toFixed(1)} km · 預計完成 ${formatClock(cursor)}</div>

      ${renderDetailedRouteMap(legs, legs.map(function (leg) { return leg.from; }).concat(legs.length ? [legs[legs.length - 1].to] : []))}`;

    const rawSequence = [start].concat(routeStops.map(function (stop) { return stop.location; })).concat(shouldReturn && routeStops.length ? [start] : []);

  function toggleCourseInRoute(cell) {
    const key = cell.courseKey || selectedKey(cell);
    const exact = routeStops.findIndex(function (stop) { return stop.courseKey === key; });
    if (exact >= 0) {
      routeStops.splice(exact, 1);
      renderRouteStops();
      renderDailySchedule();
      return;
    }
    const span = minutes(cell.time);
    const duration = cell.classMin || (span ? Math.max(15, span.end - span.start) : 60);
    const dateText = root.querySelector("#dp-work-date").value || "2026-09-26";
    const metadata = {
      courseKey:key, location:cell.venue, classMin:duration, delayMin:0,
      label:cell.label || cell.title || cell.venue,
      timeText:cell.time || "自訂時間",
      sortStart:cell.sortStart ?? (span ? span.start : null),
      dateText:dateText,
      day:cell.day || selectedDay,
      pickOrder:++routePickOrder, color:cell.color || "blue"
    };
    routeStops.push(metadata);
    routeStops.sort(function (a,b) {
      const timeDiff = (a.sortStart ?? 9999) - (b.sortStart ?? 9999);
      return timeDiff || (a.pickOrder || 0) - (b.pickOrder || 0);
    });
    renderRouteStops();
    renderDailySchedule();
  }

  function hmClock(value) {

  function activeWorkVersion(series, dateText) {

  function workLocation(title) {
    if (/HUK东/.test(title)) return "HUK 世茂店";

    if (/\bOD\b|^OD/.test(title)) return "O-DOG";
    if (/AS/.test(title)) return "AS";
    if (/i5/i.test(title)) return "i5私教";
    if (/meta/i.test(title)) return "meta";
    if (/西美/.test(title)) return "西美";
    if (/洋湖/.test(title)) return "洋湖實驗";
    if (/長郡|长郡/.test(title)) return "長郡外國語實驗";
    if (/隊訓|队训/.test(title)) return "隊訓";
    if (/早功|练习/.test(title)) return "家";
    if (/反對反對法的發/.test(title)) return "反對反對法的發";
    return "";
  }
  function workEventCard(event, mandatory) {

  function bindWorkCards(host, events) {
    host.querySelectorAll("[data-work]").forEach(function (button) {
      button.addEventListener("click", function () {
        const event = events.find(function (item) { return item.key === button.dataset.work; });
        if (!event || !baiduCoords[event.location]) return;
        toggleCourseInRoute({ courseKey:event.key, venue:event.location, day:selectedDay, time:event.time, classMin:event.classMin, label:event.title, sortStart:event.start, color:event.color });
        renderWorkSchedule();

  function renderWorkSchedule() {
    const regularHost = root.querySelector("#dp-work-list");
    const mandatoryHost = root.querySelector("#dp-mandatory-list");
    if (!regularHost || !mandatoryHost) return;
    const dateText = root.querySelector("#dp-work-date").value || "2026-09-26";
    const events = [];
    workScheduleData.forEach(function (series) {
      if (series.id === "amu2zc1nn-1-xtkc") return;
      if ((series.versions || []).some(function (version) { return String(version.title || "").includes("反對反對法的發"); })) return;
      const version = activeWorkVersion(series, dateText);
      if (!version || dayOrder[version.day] !== selectedDay) return;
      const location = workLocation(version.title);
      const tags = String(version.title || "") + " " + String(version.note || "");
      const mandatory = version.color === "orange" || version.color === "brown" || /隊訓|队训/.test(tags);
      events.push({
        key:"work:" + series.id + ":" + String(dateText),
        title:version.title, location:location || "待設定",
        start:version.start, end:version.end,
        time:hmClock(version.start) + "-" + hmClock(version.end),
        classMin:Math.max(15, version.end - version.start), color:version.color, mandatory:mandatory
      });
    });
    events.sort(function (a,b) { return a.start-b.start; });
    const mandatoryEvents = events.filter(function (event) { return event.mandatory; });
    const regularEvents = events.filter(function (event) { return !event.mandatory; });
    if (!mandatoryEvents.length) mandatoryHost.innerHTML = `<p class="text-small text-muted">目前沒有檢測到褐色或隊訓安排。</p>`;
    else mandatoryHost.innerHTML = mandatoryEvents.map(function (event) { return workEventCard(event, true); }).join("");
    regularHost.innerHTML = regularEvents.length ? regularEvents.map(function (event) { return workEventCard(event, false); }).join("") : `<p class="text-small text-muted">這一天沒有其他工作日程。</p>`;
    bindWorkCards(mandatoryHost, mandatoryEvents);

  function syncWorkDateToDay() {
    const input = root.querySelector("#dp-work-date"); if (!input) return;
    const current = new Date((input.value || "2026-09-26") + "T00:00:00");
    const target = dayOrder.indexOf(selectedDay);
    if (target < 0 || isNaN(current.getTime())) return;
    const currentIndex = (current.getDay() + 6) % 7;
    const diff = (target - currentIndex + 7) % 7;
    current.setDate(current.getDate() + diff);
    input.value = [current.getFullYear(), String(current.getMonth()+1).padStart(2,"0"), String(current.getDate()).padStart(2,"0")].join("-");
  }

      reader.onload = function () {
        try {
          const parsed = JSON.parse(reader.result);
          const loaded = Array.isArray(parsed) ? parsed : (parsed.arrs || []);
          workScheduleData = loaded.filter(function (series) {
            return series.id !== "amu2zc1nn-1-xtkc" && !(series.versions || []).some(function (version) { return String(version.title || "").includes("反對反對法的發"); });

  function renderDailySchedule() {

    let previous = null;

      const travel = previous ? routeInfo(previous.location, item.location) : null;
      let status = "";

        const previousEnd = previous.sortStart + previous.classMin + (previous.delayMin || 0);

  function colorHex(token) {

    return lines;
  }
  function exportDailyImage() {
    const items = dailyItems();
    if (!items.length) { alert("請先選取行程，再輸出圖片。"); return; }
    const dateText = root.querySelector("#dp-work-date").value || "2026-09-26";
    const scale=2, width=1000, cardX=54, cardW=width-108, cardH=126, headerH=176, gap=18;
    const height=headerH+items.length*(cardH+gap)+74;
    const canvas=document.createElement("canvas"); canvas.width=width*scale; canvas.height=height*scale;
    const ctx=canvas.getContext("2d"); ctx.scale(scale,scale);
    ctx.fillStyle="#f3f5f9"; ctx.fillRect(0,0,width,height);
    ctx.fillStyle="#1f2937"; ctx.textAlign="left"; ctx.font="700 34px system-ui,\"Microsoft YaHei\",sans-serif";
    ctx.fillText(`${dateText} 當天行程`,54,62);
    const startLoc=root.querySelector("#dp-route-start").value;
    const sequence=[startLoc].concat(items.map(function (item) { return item.location; }));
    if (root.querySelector("#dp-route-return").checked) sequence.push(startLoc);
    ctx.fillStyle="#64748b"; ctx.font="400 18px system-ui,\"Microsoft YaHei\",sans-serif";
    const summary=wrapCanvasText(ctx,sequence.join(" → "),width-108).slice(0,2);
    summary.forEach(function (line,index) { ctx.fillText(line,54,98+index*24); });
    let previous=null;
    items.forEach(function (item,index) {
      const y=headerH+index*(cardH+gap);
      const color=colorHex(item.color);
      ctx.fillStyle=color; roundedRect(ctx,cardX,y,cardW,cardH,18); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.94)";
      ctx.font="700 22px system-ui,\"Microsoft YaHei\",sans-serif";
      ctx.fillText(String(index+1),cardX+22,y+38);
      ctx.font="700 24px system-ui,\"Microsoft YaHei\",sans-serif";
      const titleLines=wrapCanvasText(ctx,item.label || item.location,cardW-235).slice(0,2);
      titleLines.forEach(function (line,li) { ctx.fillText(line,cardX+60,y+37+li*27); });
      ctx.font="500 18px system-ui,\"Microsoft YaHei\",sans-serif";
      ctx.fillText(item.timeText || "自訂時間",cardX+60,y+92);
      ctx.fillStyle="rgba(255,255,255,.82)";
      ctx.font="400 16px system-ui,\"Microsoft YaHei\",sans-serif";
      let detail=item.location+" · 上課 "+item.classMin+" 分"+(item.delayMin ? " + 拖堂 "+item.delayMin+" 分" : "");
      if (previous) { const travel=routeInfo(previous.location,item.location); detail += " · 轉場約 "+travel.min+" 分"; }
      const detailLines=wrapCanvasText(ctx,detail,cardW-310).slice(0,2);
      detailLines.forEach(function (line,li) { ctx.fillText(line,cardX+270,y+39+li*21); });
      previous=item;
    });
    ctx.fillStyle="#94a3b8"; ctx.font="400 14px system-ui,\"Microsoft YaHei\",sans-serif"; ctx.textAlign="right";
    ctx.fillText("由舞蹈課表與路線規劃產生",width-54,height-28);
    canvas.toBlob(function (blob) {
      const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download=`當天行程_${dateText}.png`; document.body.appendChild(link); link.click(); link.remove();
      window.setTimeout(function () { URL.revokeObjectURL(link.href); },1000);
    },"image/png");
  }

  function buildDailyScheduleHtml() {
    const dateText = root.querySelector("#dp-work-date").value || "2026-09-26";
    const items = dailyItems();
    const rows = items.map(function (item, index) {
      return `<tr><td>${index + 1}</td><td>${esc(item.timeText || "")}</td><td>${esc(item.label || "")}</td><td>${esc(item.location)}</td><td>${item.classMin} 分${item.delayMin ? `＋拖堂 ${item.delayMin} 分` : ""}</td></tr>`;
    }).join("");
    return `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>當天行程 ${dateText}</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;padding:24px;color:#111}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:10px;text-align:left}th{background:#f3f4f6}</style></head><body><h1>${dateText} 當天行程</h1><table><thead><tr><th>順序</th><th>時間</th><th>安排</th><th>地點</th><th>課堂時間</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
  }
  function exportDailySchedule() {
    const dateText = root.querySelector("#dp-work-date").value || "2026-09-26";
    const blob = new Blob([buildDailyScheduleHtml()], { type:"text/html;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `當天行程_${dateText}.html`;
    document.body.appendChild(link); link.click(); link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  }

  function selectedKey(cell) { return cell.day + "|" + cell.time + "|" + cell.venue; }

  function renderDays() {
    const box = root.querySelector(".dp-controls");
    box.innerHTML = dayOrder.map(function (day) {
      return `<button type="button" class="btn dp-day" data-day="${day}" aria-pressed="${day===selectedDay}">${dayLabel[day]}</button>`;
    }).join("");
    box.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectedDay = btn.dataset.day;
        selected = null;
        renderDays();
        syncWorkDateToDay();
        renderSchedule();
        renderWorkSchedule();
        renderNext(null);
      });
    });
  }

  function renderSchedule() {
    const host = root.querySelector("#dp-schedule");
    const rows = weekly.filter(function (x) { return x.day === selectedDay; });
    const times = Array.from(new Set(rows.map(function (x) { return x.time; }))).sort(function (a,b) {
      const am = minutes(a), bm = minutes(b);
      return (am?.start ?? 0) - (bm?.start ?? 0);
    });
    if (!times.length) {
      host.innerHTML = `<p class="text-muted">這一天沒有 OCR 可辨識的每週課程。</p>`;
      return;
    }
    host.innerHTML = times.map(function (time) {
      const cells = rows.filter(function (x) { return x.time === time; });
      return `<section class="dp-slot">
        <div class="dp-slot-time">${esc(time)}</div>
        <div class="dp-cards">${cells.map(renderCourse).join("")}</div>
      </section>`;
    }).join("");
    host.querySelectorAll("[data-course]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const parts = btn.dataset.course.split("|");
        const cell = weekly.find(function (x) { return selectedKey(x) === btn.dataset.course; });
        selected = cell || null;
        if (cell) toggleCourseInRoute(Object.assign({}, cell, {
          label:cell.venue + "｜" + cell.classes.map(function (item) { return item.class; }).join(" / "),
          color:"purple",
          sortStart:minutes(cell.time) ? minutes(cell.time).start : null
        }));
        renderSchedule();
        renderNext(cell);
      });
    });
  }

  function renderCourse(cell) {
    const key = selectedKey(cell);
    const trip = home[cell.venue]?.min;
    const routeIndex = routeStops.findIndex(function (stop) { return stop.courseKey === key; });
    return `<button type="button" class="dp-course ${venueClass[cell.venue] || ""}" data-course="${esc(key)}" aria-pressed="${routeIndex >= 0}" aria-label="${esc(cell.venue)} ${esc(cell.time)}；點擊切換加入或取消軌跡">
      <div class="dp-course-title"><strong>${esc(cell.venue)}${routeIndex >= 0 ? ` · 路線第 ${routeIndex + 1} 站` : ""}</strong><span class="text-small text-muted">家→${trip ?? "?"} 分</span></div>
      <div class="dp-classes">${cell.classes.slice(0,6).map(function (c) {
        return `<div class="dp-class"><span>${esc(c.class)}</span><span class="text-small text-muted">${esc(c.teacher || "老師待核對")}</span></div>`;
      }).join("")}</div>
    </button>`;
  }

  function renderNext(cell) {
    const host = root.querySelector("#dp-next");
    if (!cell) {
      host.innerHTML = "";
      return;
    }
    const span = minutes(cell.time);
    if (!span) { host.innerHTML = ""; return; }
    const candidates = weekly.filter(function (x) {
      if (x.day !== cell.day || x.venue === cell.venue) return false;
      const m = minutes(x.time);
      return m && m.start >= span.end + routeMinutes(cell.venue, x.venue) + 4;
    }).sort(function (a,b) { return (minutes(a.time)?.start ?? 9999) - (minutes(b.time)?.start ?? 9999); }).slice(0,3);
    if (!candidates.length) {
      host.innerHTML = `<p class="text-small text-muted">這節課後沒有找到可直接銜接的下一節課。</p>`;
      return;
    }
    host.innerHTML = `<p class="text-small text-muted">從 ${esc(cell.venue)} 下課後可銜接：` +
      candidates.map(function (x) { return `${esc(x.time)} ${esc(x.venue)}（${routeMinutes(cell.venue,x.venue)} 分）`; }).join(" · ") + `</p>`;
  }

  function renderVenues() {
    root.querySelector("#dp-venues").innerHTML = Object.keys(home).map(function (venue) {
      const item = home[venue];
      return `<div class="card ${venueClass[venue] || ""}" style="border-left:4px solid var(--venue-color)">
        <strong>${esc(venue)}</strong>
        <div class="text-small text-muted" style="margin:.25rem 0 .5rem">${esc(venueAddress[venue] || "")}</div>
        <div>家 → ${esc(venue)}：約 <span class="tabular-nums">${item.min}</span> 分（${item.km} km）</div>
      </div>`;
    }).join("");
  }

  function renderMatrix() {
    const names = ["HUK 河西店","HUK 世茂店","BAD EGGS","O-DOG"];
    const rows = [];
    for (let i=0;i<names.length;i++) {
      for (let j=i+1;j<names.length;j++) {
        const a = names[i], b = names[j], item = between[a]?.[b];
        if (!item) continue;
        rows.push(`<tr><td>${esc(a)}</td><td>${esc(b)}</td><td class="text-end tabular-nums">${item.km} km</td><td class="text-end tabular-nums">${item.min} 分</td></tr>`);
      }
    }
    root.querySelector("#dp-matrix-body").innerHTML = rows.join("");
  }

  initRoutePlanner();
  initWorkSchedule();
  renderDays();
  renderSchedule();
  renderWorkSchedule();
  renderVenues();
  renderMatrix();
})();
</script>

(function(){
  var installBtn=document.createElement('button');
  installBtn.id='pwa-install-button';
  installBtn.type='button';
  installBtn.textContent='安裝到手機';
  installBtn.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;display:none;border:0;border-radius:999px;padding:12px 18px;background:#2563eb;color:#fff;font:600 15px system-ui;box-shadow:0 8px 24px rgba(37,99,235,.35)';
  document.body.appendChild(installBtn);
  var promptEvent=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();promptEvent=e;installBtn.style.display='block';});
  installBtn.addEventListener('click',function(){if(!promptEvent)return;promptEvent.prompt();promptEvent.userChoice.then(function(){promptEvent=null;installBtn.style.display='none';});});
  window.addEventListener('appinstalled',function(){installBtn.style.display='none';});
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js?v=2').catch(function(){});});}
})();
</script>
