<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f6ef2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>我的每日工作日程表</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#eef1f7;color:#1f2430;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:20px 20px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:13px}
.logo{font-size:34px;line-height:1}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px}
.sub{margin:5px 0 0;color:#7b8494;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #d7dce6;background:#fff;color:#3b4252;font:inherit;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#aeb7c9;background:#f7f9fd}
.btn.primary{background:linear-gradient(135deg,#4f6ef2,#7c5cf5);color:#fff;border:none;box-shadow:0 6px 14px rgba(79,110,242,.28)}
.btn.primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,#4f6ef2,#7c5cf5)}
.weekbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:8px 10px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,41,59,.04)}
.week-title{font-size:14px;font-weight:700;color:#2b3344;letter-spacing:.3px}
.nav{width:32px;height:32px;border-radius:10px;border:1px solid #d7dce6;background:#fff;color:#4b5563;font-size:18px;cursor:pointer;line-height:1;flex:0 0 auto}
.nav:hover{background:#f2f5fb;border-color:#b9c2d4}
.hint{background:#fff8e6;border:1px solid #f3dfa8;color:#7a5b13;font-size:13px;padding:10px 12px 10px 16px;border-radius:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.6}
.hint b{color:#5d4507}
.hint .close{cursor:pointer;border:none;background:transparent;color:#8a6a1c;font-size:18px;line-height:1;padding:4px}
.board-wrap{background:#fff;border:1px solid #e3e8f0;border-radius:16px;box-shadow:0 10px 30px rgba(30,41,59,.06);overflow:hidden}
.board-scroll{overflow-x:auto}
.board{min-width:1040px}
.day-header-row{display:grid;grid-template-columns:64px repeat(7,1fr);background:#fbfcff;border-bottom:1px solid #e6eaf2}
.gutter-head{}
.dh{padding:10px 2px 12px;text-align:center;border-right:1px solid #f0f3f9}
.dh:last-child{border-right:none}
.dh .wd{font-size:12px;color:#8a93a6;margin-bottom:4px}
.dh .dt{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:15px;font-size:13.5px;font-weight:700;color:#39415a}
.dh.we .wd{color:#b6bdcb}
.dh.we .dt{color:#9aa3b2}
.dh.today .wd{color:#4f6ef2;font-weight:700}
.dh.today .dt{background:linear-gradient(135deg,#4f6ef2,#8b5cf6);color:#fff;box-shadow:0 4px 10px rgba(79,110,242,.35)}
.day-body-row{display:grid;grid-template-columns:64px repeat(7,1fr);height:952px}
.gutter{position:relative;border-right:1px solid #e6eaf2;background:#fbfcff}
.tl{position:absolute;right:12px;top:0;font-size:11px;color:#98a1b3;font-variant-numeric:tabular-nums;line-height:1}
.daycol{position:relative;border-right:1px solid #eff2f8;background-color:#fff;cursor:pointer;overflow:hidden;
 background-image:repeating-linear-gradient(to bottom, transparent 0 55px, #eef1f8 63px 64px),repeating-linear-gradient(to bottom, transparent 0 27px, #f6f8fc 31px 32px)}
.daycol:last-child{border-right:none}
.daycol.we{background-color:#fcfcfe}
.daycol.today{background-color:#f5f7ff}
.ev{position:absolute;left:6px;right:6px;z-index:2;border-radius:9px;padding:5px 9px 5px 12px;color:#fff;overflow:hidden;cursor:grab;box-shadow:0 3px 8px rgba(30,41,59,.18);user-select:none;-webkit-user-select:none;transition:box-shadow .15s;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.ev:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(15,23,42,.20)}
.ev:active{cursor:grabbing}
.ev:hover{box-shadow:0 8px 18px rgba(30,41,59,.25);z-index:6}
.ev .t{font-size:12.5px;font-weight:600;line-height:1.3;word-break:break-word}
.ev .m{font-size:10.5px;opacity:.96;margin-top:2px;font-variant-numeric:tabular-nums}
.ev .acts{position:absolute;top:4px;right:4px;display:none;gap:4px;z-index:3}
.ev:hover .acts{display:flex}
.ev .acts button{width:17px;height:17px;border-radius:50%;border:none;background:rgba(15,23,42,.34);color:#fff;font-size:11px;line-height:16px;text-align:center;cursor:pointer;padding:0;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.ev .acts button:hover{background:rgba(15,23,42,.6)}
.ev.dragging{opacity:.92;z-index:30;pointer-events:none;box-shadow:0 16px 28px rgba(30,41,59,.28)}
.now-line{position:absolute;left:0;right:0;z-index:8;pointer-events:none}
.now-line i{display:block;border-top:2px solid #ef4444}
.now-line span{position:absolute;right:2px;top:-9px;font-size:10px;background:#ef4444;color:#fff;padding:1px 6px;border-radius:8px;font-style:normal;white-space:nowrap}
.pastebar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;background:#1f2937;color:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 14px 34px rgba(15,23,42,.4);font-size:13px;max-width:min(92vw,680px)}
.pastebar.hidden{display:none}
.pastebar .pb-dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.pastebar .pb-txt{line-height:1.5;min-width:0}
.pastebar .btn{background:rgba(255,255,255,.16);border:none;color:#fff;padding:6px 12px;font-size:12.5px;border-radius:9px;cursor:pointer;flex:0 0 auto}
.pastebar .btn:hover{background:rgba(255,255,255,.28)}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.46);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.hidden{display:none}
.dialog{background:#fff;border-radius:16px;width:390px;max-width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(15,23,42,.35);animation:pop .16s ease;max-height:92vh;overflow:auto}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.dialog h3{margin:0 0 3px;font-size:17px}
.dialog .dsub{color:#7b8494;font-size:12.5px;margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#4b5563;margin-bottom:6px}
.field input[type=text],.field input[type=time],.field textarea{width:100%;border:1px solid #d9dfe9;border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none;background:#fcfdff;color:#1f2430}
.field input:focus,.field textarea:focus{border-color:#4f6ef2;box-shadow:0 0 0 3px rgba(79,110,242,.15);background:#fff}
.field textarea{resize:vertical;min-height:54px}
.times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.times .sep{color:#9aa3b2;font-size:12px;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:all .12s;display:inline-flex;align-items:flex-end;justify-content:flex-start;padding:2px 4px}
.sw:hover{transform:scale(1.1)}
.sw.sel{border-color:#1f2430;box-shadow:0 0 0 2px #fff inset}
.sw .nm{font-size:9px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);white-space:nowrap}
.dnote{font-size:12px;color:#8a93a6;line-height:1.5;margin-top:4px}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}
.dfoot .grow{flex:1}
.dfoot .btn.danger{color:#dc2626;border-color:#f3c4c4;background:#fef2f2}
.dfoot .btn.danger:hover{background:#fee2e2}
@media (max-width:760px){.brand h1{font-size:18px}.topbar{align-items:flex-start}}
@media print{
 body{background:#fff}
 .app{max-width:none;padding:0}
 .topbar .actions,.nav,.hint,.no-print{display:none!important}
 .board-wrap{border:none;box-shadow:none;border-radius:0}
 .board{min-width:0}
 .daycol{cursor:default}
 .ev .acts{display:none!important}
 .pastebar{display:none!important}
 .weekbar{margin-bottom:8px}
}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid #e5e9f2;border-radius:10px;margin-bottom:7px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{background:#f7f9fd}
.opt.sel{border-color:#4f6ef2;background:#f0f4ff}
.opt input[type=radio]{accent-color:#4f6ef2;margin-top:3px;flex:0 0 auto}
.opt .lbl{display:block;font-size:13.5px;font-weight:600;color:#2b3344}
.opt .sub{display:block;font-size:11.5px;color:#8a93a6;margin-top:2px;line-height:1.4}
.opt .cnum{width:74px;border:1px solid #d9dfe9;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;margin-left:4px}
.cprev{font-size:12px;color:#6b7280;margin:2px 0 8px 30px;min-height:16px;line-height:1.5}
.dialog.scope{width:430px}#bgShade{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(255,255,255,.35)}
.app{position:relative;z-index:1}
.bgrow{display:flex;gap:8px}
.bgrow input[type=text]{flex:1}
.shadev{font-size:12px;color:#6b7280;margin-left:8px;min-width:34px;display:inline-block}
.bgprev{height:130px;border-radius:12px;border:1px solid #e3e8f0;background-color:#eef1f7;background-position:center;background-repeat:no-repeat;background-size:cover}
.dialog.bg{width:460px}
input[type=file]{font-size:12.5px;color:#4b5563;max-width:100%}
input[type=range]{width:220px;accent-color:#4f6ef2;vertical-align:middle}
@media print{body{background:#fff!important}#bgShade{display:none!important}}.board-wrap{position:relative}
.board-bgoverlay{position:absolute;inset:0;z-index:0;display:none;pointer-events:none}
.board-scroll{position:relative;z-index:1}
body.bg-on .board-wrap{background-position:center;background-repeat:no-repeat;background-size:cover}
body.bg-on .board-bgoverlay{display:block}
body.bg-on .day-header-row{background:rgba(255,255,255,.35)}
body.bg-on .gutter{background:rgba(255,255,255,.35)}
body.bg-on .daycol{background-color:transparent}
body.bg-on .daycol.today{background-color:rgba(79,110,242,.10)}
body.bg-on .daycol.we{background-color:rgba(255,255,255,.05)}
@media print{
 body.bg-on .board-wrap{background:#fff!important}
 body.bg-on .board-bgoverlay{display:none!important}
 body.bg-on .day-header-row,body.bg-on .gutter{background:#fbfcff!important}
 body.bg-on .daycol,body.bg-on .daycol.today{background-color:#fff!important}
}.tl{font-size:var(--tsize,11px);font-weight:700;color:#475569;font-family:var(--tfont,inherit)}
.dh .wd{font-size:calc(var(--tsize,12px) + 1px);color:#42506b;font-family:var(--tfont,inherit)}
.dh .dt{font-size:var(--tsize,13.5px);font-family:var(--tfont,inherit)}
.ev .m{font-size:calc(var(--tsize,12px) - 1px);font-family:var(--tfont,inherit)}
.daycol{background-image:repeating-linear-gradient(to bottom, transparent 0 55px, var(--gl,#eef1f8) 63px 64px),repeating-linear-gradient(to bottom, transparent 0 27px, var(--gl2,#f6f8fc) 31px 32px)}
.rad{display:inline-flex;align-items:center;gap:6px;margin:0 14px 8px 0;cursor:pointer;font-size:13px;color:#374151}
.rad input{accent-color:#4f6ef2}
select.vsel{width:100%;border:1px solid #d9dfe9;border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;background:#fcfdff;color:#1f2430;outline:none}
select.vsel:focus{border-color:#4f6ef2;box-shadow:0 0 0 3px rgba(79,110,242,.15)}
#vpv{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:12px 14px;font-size:14px;color:#1f2430;line-height:1.5}.ev .t{display:block}
.ev .m{display:block;margin-top:3px}.ev{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:7px 28px 7px 12px;min-height:30px;text-align:left}
.ev .t{line-height:1.35;flex:0 0 auto}
.ev:not(.big) .m{display:none}
.ev.big .m{margin-top:7px;line-height:1.25;flex:0 0 auto}.ev .t{font-family:var(--etfont,var(--tfont,inherit));font-size:var(--etsize,13px);font-weight:var(--etw,700);color:var(--etcol,#ffffff)}
.ev .m{font-family:var(--emfont,var(--tfont,inherit));font-size:var(--emsize,11px);font-weight:var(--emw,500);color:var(--emcol,#ffffff)}
.ev{padding:8px 28px 8px 13px}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#4b5563;margin-bottom:4px}
.crow input[type=range]{flex:1;min-width:130px}
.crow input[type=color]{width:34px;height:28px;padding:1px;border:1px solid #d9dfe9;border-radius:7px;background:#fff;cursor:pointer}
.crow input[type=checkbox]{accent-color:#4f6ef2;width:15px;height:15px}
.crow .lab{min-width:34px}.ev .t,.ev .m{text-align:var(--eal,left);font-style:var(--eit,normal)}.ev .t{text-align:var(--etaf,left);font-style:var(--etit,normal);text-decoration:var(--etul,none);text-shadow:var(--etsh,none)}
.ev .m{text-align:var(--emaf,left);font-style:var(--emit,normal);text-decoration:var(--emul,none);text-shadow:var(--emsh,none)}
.crow select.vsel{width:92px;padding:5px 6px}.ev{align-items:stretch}
.ev .t,.ev .m{width:100%}.maintitle-wrap{text-align:center;margin:4px 0 2px;position:relative}
.maintitle{display:inline-block;font-size:36px;font-weight:800;letter-spacing:1px;color:#1f2937;line-height:1.2;padding:2px 10px;border:2px dashed transparent;border-radius:12px;outline:none;transition:border-color .15s;background:none}
.maintitle.editing{border-color:#4f6ef2;background:rgba(79,110,242,.06);cursor:text}
.mtbtn{margin-left:8px;border:1px solid #d7dce6;background:#fff;color:#3b4252;font:inherit;font-size:13px;padding:5px 10px;border-radius:9px;cursor:pointer;vertical-align:middle}
.mtbtn:hover{border-color:#4f6ef2;color:#4f6ef2}.floating{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.floating .float-panel{display:none;background:#fff;border:1px solid #e3e8f0;border-radius:14px;box-shadow:0 12px 30px rgba(30,41,59,.18);padding:8px;min-width:170px}
.floating.open .float-panel{display:flex;flex-direction:column;gap:5px}
.float-panel .btn{width:100%;justify-content:flex-start;padding:7px 10px;font-size:12.5px}
.float-toggle{width:46px;height:46px;border-radius:50%;border:1px solid #d7dce6;background:#fff;color:#3b4252;font-size:19px;cursor:pointer;box-shadow:0 6px 18px rgba(30,41,59,.18);transition:transform .2s}
.float-toggle:hover{background:#f2f5fb}
.floating.open .float-toggle{transform:rotate(45deg)}
.hint{display:none}
.hint.show{display:flex}
.mtbtn{opacity:0;transition:opacity .18s}
.maintitle-wrap:hover .mtbtn,.maintitle-wrap:focus-within .mtbtn{opacity:1}
@media print{.floating{display:none!important}}.hidebar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;display:flex;align-items:center;gap:10px;background:#7c2d12;color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 14px 34px rgba(15,23,42,.4);font-size:13px;max-width:92vw;flex-wrap:wrap}
.hidebar.hidden{display:none}
.hidebar .btn{background:rgba(255,255,255,.16);border:none;color:#fff;padding:6px 10px;font-size:12.5px;border-radius:9px;cursor:pointer}
.hidebar .btn:hover{background:rgba(255,255,255,.3)}
body.hide-mode .ev{cursor:crosshair}
body.hide-mode .ev .acts{display:none!important}
body.hide-mode .ev:hover{outline:2px dashed #f59e0b;outline-offset:-2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:130;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 24px rgba(15,23,42,.35);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media print{.hidebar,.toast{display:none!important}}body{-webkit-tap-highlight-color:transparent}
.ev{touch-action:manipulation}
@media (max-width:860px){
 .app{padding:10px 8px 90px}
 .maintitle{font-size:25px}
 .maintitle-wrap{margin:2px 0 0}
 .weekbar{margin-bottom:10px}
 .nav{width:42px;height:42px;font-size:22px}
 .board{min-width:920px}
 .tl{font-size:12.5px}
 .dh .wd{font-size:14px}
 .dh .dt{font-size:14px}
 .ev{padding:9px 22px 9px 12px}
 .floating{right:10px;bottom:10px}
 .float-toggle{width:56px;height:56px;font-size:23px}
 .float-panel{min-width:210px}
 .float-panel .btn{padding:12px 12px;font-size:14px}
 .dialog{width:100%;max-width:100%;padding:16px}
 .times{grid-template-columns:1fr;gap:6px}
 .times .sep{display:none}
 .hidebar,.pastebar{left:8px;right:8px;transform:none;bottom:8px}
}</style>
</head><body>
<div id="bgShade"></div>
<div class="app">
  <div class="maintitle-wrap">
    <div class="maintitle" id="mainTitle" title="双击或点 ✏️ 修改大标题">我的每日工作日程表</div>
    <button class="mtbtn" id="mtEdit" title="修改大标题">✏️ 修改</button>
  </div>


  <div class="weekbar no-print">
    <button class="nav" id="prevWeek" title="上一周">‹</button>
    <div class="week-title" id="weekTitle"></div>
    <button class="nav" id="nextWeek" title="下一周">›</button>
  </div>

  <div class="hint no-print" id="hint">
    <span>💡 <b>使用说明</b>：点空白处添加（从本周起每周重复）；修改/拖动/删除某周安排会询问同步到以后第几周。<br>📱 <b>手机上</b>：左右滑动查看整周，点卡片即可修改（手机上不会误拖动卡片）。<br>🔄 <b>换设备</b>：点右下角 ⚙️ →「导出数据」生成文件 → 发到手机 → 手机上点「导入数据」选择该文件，即可在手机上继续修改；改完再导出导回电脑。</span>
    <button class="close" id="hintClose" title="关闭">✕</button>
  </div>

  <div class="board-wrap">
    <div class="board-bgoverlay" id="boardBgOverlay"></div>
    <div class="board-scroll">
      <div class="board">
        <div class="day-header-row" id="dayHeader"></div>
        <div class="day-body-row" id="dayBody"></div>
      </div>
    </div>
  </div>
  <p class="dnote no-print" style="margin:12px 2px 0">配色说明：<span id="legend"></span> · 时间范围 09:00 – 次日 02:00（共 17 小时），可跨周查看；红色竖线表示“现在”。</p>
</div>

<div class="hidebar hidden" id="hideBar"><span id="hideTxt"></span><button class="btn" id="hideUndo">撤销上一张</button><button class="btn" id="hideRestore">恢复本周隐藏</button><button class="btn" id="hideDone">✔ 完成</button></div>
  <div class="pastebar hidden" id="pasteBar"><span class="pb-dot" id="pbDot"></span><span class="pb-txt" id="pbTxt"></span><button class="btn" id="pbDone">✔ 完成</button></div>  <div class="floating no-print" id="floatWrap">
    <div class="float-panel" id="floatPanel">
      <button class="btn" id="todayBtn">📍 回到本周</button>
      <button class="btn" id="resetBtn">↺ 恢复示例</button>
      <button class="btn" id="viewBtn">🔤 显示</button>
      <button class="btn" id="bgBtn">🎨 背景</button>
      <button class="btn" id="exportBtn">🖼 导出图片</button>
      <button class="btn" id="wxBtn">📋 复制图片（发微信）</button>
      <button class="btn" id="hideBtn">🙈 批量隐藏卡片</button>
      <button class="btn" id="unhideBtn">👁 恢复本周隐藏</button>
      <button class="btn" id="dataOutBtn">⬇ 导出数据（换设备）</button>
      <button class="btn" id="dataInBtn">⬆ 导入数据（从手机/电脑）</button>

const startOfWeek=function(d){var x=new Date(d);var day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x;};

  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dayNum=(t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-dayNum+3);
  var ft=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  if(ft.getUTCDay()!==4){ ft.setUTCMonth(0,1+((4-ft.getUTCDay())+7)%7); }
  return 1+Math.round((t-ft)/604800000);
}
function labelWeek(k){
  var d=parseKey(k), e=addDays(d,6);

  try{ raw1=localStorage.getItem(STORE_V1); }catch(e){}

    try{ var o=JSON.parse(raw3); state.arrs=(o&&o.arrs)?o.arrs:[]; }catch(e){ state.arrs=[]; }
    if(state.arrs.length===0){ state.arrs=sampleArrs(); }
  } else if(raw1){
    try{ migrate(JSON.parse(raw1)); }catch(e){ state.arrs=sampleArrs(); }
    if(state.arrs.length===0){ state.arrs=sampleArrs(); }
  } else {
    state.arrs=sampleArrs();
  }
  sanitizeData();
  save();
}
function migrate(list){
  state.arrs=list.map(function(x){
    return {id:uid(),versions:[{from:null,to:null,day:x.day,start:x.start,end:x.end,title:x.title||"（未命名安排）",color:x.color||"blue",note:x.note||"",deleted:false}]};
  });
}
function sanitizeData(){
  for(var i=0;i<state.arrs.length;i++){
    var arr=state.arrs[i];
    if(!arr||!arr.versions) continue;
    for(var j=0;j<arr.versions.length;j++){
      var v=arr.versions[j];
      if(typeof v.title!=="string"||!v.title.trim()) v.title="（未命名安排）";
      if(!v.color) v.color="blue";
      if(typeof v.note!=="string") v.note="";
      if(typeof v.day!=="number") v.day=0;
      if(typeof v.start!=="number") v.start=DAY_START;
      if(typeof v.end!=="number") v.end=DAY_START+60;
    }
  }
}
function sampleArrs(){
  var k=weekKey(new Date());
  return SAMPLE.map(function(x){
    return {id:uid(),versions:[{from:k,to:null,day:x.day,start:x.start,end:x.end,title:x.title,color:x.color||"blue",note:x.note||"",deleted:false}]};
  });
}
function save(){
  try{ localStorage.setItem(STORE_V3,JSON.stringify({v:3,arrs:state.arrs})); }catch(e){}

}
function activeFor(arr,key){
  var best=null;
  for(var i=0;i<arr.versions.length;i++){
    var v=arr.versions[i];
    if((v.from===null||v.from<=key)&&(v.to===null||key<v.to)){
      if(!best||fromVal(v.from)>fromVal(best.from)) best=v;
    }
  }
  return best;
}
function weekEvents(key){
  var out=[];
  for(var i=0;i<state.arrs.length;i++){
    var arr=state.arrs[i], v=activeFor(arr,key);
    if(v&&!v.deleted){

    }
  }
  return out;
}
function isCurrentWeek(){ return weekKey(new Date())===weekKey(state.weekStart); }function renderWeekTitle(){
  var a=state.weekStart, b=addDays(a,6), k=weekKey(a);
  var txt=a.getFullYear()+"年"+(a.getMonth()+1)+"月"+a.getDate()+"日 — "+
          b.getFullYear()+"年"+(b.getMonth()+1)+"月"+b.getDate()+"日 · "+labelWeek(k);

function renderHeader(){

}
function renderBody(){
  var now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  var cells=(DAY_END-DAY_START)/60;
  var htmlG="<div class=\"gutter\">";
  for(var k=0;k<cells;k++){
    htmlG+="<span class=\"tl\" style=\"top:"+(k*PX+2)+"px\">"+timeText(DAY_START+k*60)+"</span>";
  }

    var d=addDays(state.weekStart,i);

    var cls="daycol"+(i>=5?" we":"")+(sameDay(d,now)?" today":"");
    col.className=cls; col.dataset.day=i;
    $("#dayBody").appendChild(col);

      var ln=document.createElement("div");

function renderEvents(){
  var key=weekKey(state.weekStart);
  var evs=weekEvents(key).filter(function(x){ return !hidden[key+"|"+x.arrId]; }).sort(function(a,b){
    if(a.day!==b.day)return a.day-b.day;
    if(a.start!==b.start)return a.start-b.start;
    return (a.title<b.title?-1:(a.title>b.title?1:0));
  });
  for(var i=0;i<evs.length;i++){
    var ev=evs[i];

function bindEvent(el,ev){
  let sx=0,sy=0,origDay=0,origStart=0,started=false,moved=false,suppress=false;
  el.addEventListener("pointerdown",function(e){
    if(e.button!==0) return;
    if(e.target.closest(".acts")) return;
    if(hideMode) return;
    if(e.pointerType==="touch") return;
    started=true; moved=false; suppress=false;
    sx=e.clientX; sy=e.clientY; origDay=ev.day; origStart=ev.start;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener("pointermove",function(e){
    if(!started) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4){ moved=true; suppress=true; el.classList.add("dragging"); }
    if(moved){ el.style.transform="translate("+dx+"px,"+dy+"px)"; }
  });
  function endDrag(e){
    if(!started) return;
    started=false;
    el.classList.remove("dragging");
    el.style.transform="";
    if(moved){
      var dx=e.clientX-sx, dy=e.clientY-sy;
      var colW=(cols[0]?cols[0].clientWidth:120)||120;
      var nd=origDay+Math.round(dx/colW);
      nd=Math.max(0,Math.min(6,nd));
      var dm=Math.round(dy/PX*60/15)*15;
      var ns=Math.max(DAY_START,Math.min(DAY_END-15,origStart+dm));
      var ne=Math.max(ns+15,Math.min(DAY_END,ev.end+(ns-origStart)));
      if(nd!==origDay||ns!==origStart){
        beginChange("drag",ev,{day:nd,start:ns,end:ne,title:ev.title||"（未命名安排）",color:ev.color||"blue",note:ev.note||""});
      }
    }
    moved=false;
  }
  el.addEventListener("pointerup",endDrag);
  el.addEventListener("pointercancel",endDrag);
  el.addEventListener("click",function(e){
    if(suppress){ suppress=false; return; }
    if(e.target.closest(".acts")) return;
    if(hideMode){ hideCard(ev); return; }
    openDialog("edit",ev);
  });
  el.querySelector(".cp").addEventListener("click",function(e){
    e.stopPropagation();
    copyEvent(ev);
  });
  el.querySelector(".rm").addEventListener("click",function(e){
    e.stopPropagation();
    beginChange("delete",ev,null);
  });
}
function bindCols(){
  for(var i=0;i<cols.length;i++){
    (function(col,day){
      col.addEventListener("click",function(e){
        if(e.target.closest(".ev")) return;
        var rect=col.getBoundingClientRect();
        var y=e.clientY-rect.top;
        var m=DAY_START+Math.floor(y/PX*60);
        m=Math.round(m/15)*15;
        m=Math.max(DAY_START,Math.min(DAY_END-30,m));
        var end=Math.min(DAY_END,m+60);
        if(pasteOn&&clip){
          doPaste(day,m);
        }else{
          openDialog("create",{day:day,start:m,end:end,title:"",color:"blue"});
        }
      });
    })(cols[i],i);
  }
}
let clip=null, pasteOn=false;
const HIDE_KEY="myScheduleHidden";

function loadHidden(){ try{ var raw=localStorage.getItem(HIDE_KEY); hidden=raw?(JSON.parse(raw)||{}):{}; }catch(e){ hidden={}; } }

  if(hideMode){ bar.classList.remove("hidden"); $("#hideTxt").textContent="🙈 批量隐藏模式：点击卡片即可隐藏（本周已隐藏 "+hideCountForWeek(weekKey(state.weekStart))+" 张）"; }

function setHideMode(on){ hideMode=!!on; document.body.classList.toggle("hide-mode",hideMode); if(hideMode&&pasteOn) cancelPaste(); updateHideBar(); }
function hideCard(ev){

}

  setTimeout(function(){ d.classList.add("on"); },10);

function copyEvent(ev){

}
function doPaste(day,m){
  var dur=clip.dur||60;
  var K=weekKey(state.weekStart);
  var f={day:day,start:m,end:Math.max(m+15,Math.min(DAY_END,m+dur)),title:clip.title,color:clip.color,note:clip.note||""};
  state.arrs.push({id:uid(),versions:[{from:K,to:null,day:f.day,start:f.start,end:f.end,title:f.title,color:f.color,note:f.note,deleted:false}]});
  save(); renderAll();
  var d=addDays(state.weekStart,day);
  $("#pbTxt").textContent="✔ 已粘贴「"+clip.title+"」到 "+WD[day]+"（"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+fmt(m)+"）—— 可继续点击其他日期空白处粘贴";

}let curEsc=null;
function attachOverlayClose(ov,fn){

  ov.addEventListener("click",function(e){ if(e.target===ov&&down){ fn(); } });
  ov.addEventListener("mouseup",function(){ setTimeout(function(){ down=false; },0); });
}
function normalize(arr){
  arr.versions.sort(function(a,b){return fromVal(a.from)-fromVal(b.from);});
  arr.versions=arr.versions.filter(function(v){ return !(v.from!==null&&v.to!==null&&v.from>=v.to); });
}
function applyChange(arr,K,fields,toEx,deleted){
  var cur=activeFor(arr,K);
  var old=cur?snapV(cur):null;
  var f={day:fields.day,start:fields.start,end:fields.end,title:(typeof fields.title==="string"?fields.title:(old?(old.title||"（未命名安排）"):"（未命名安排）")),color:(fields.color||(old?old.color:null)||"blue"),note:(typeof fields.note==="string"?fields.note:(old?old.note||"":""))};
  var nv=null;
  if(cur&&cur.from===K){
    cur.day=f.day; cur.start=f.start; cur.end=f.end; cur.title=f.title; cur.color=f.color; cur.note=f.note;
    cur.deleted=!!deleted; cur.to=toEx; nv=cur;
  } else if(cur){
    cur.to=K;
    nv={from:K,to:toEx,day:f.day,start:f.start,end:f.end,title:f.title,color:f.color,note:f.note,deleted:!!deleted};
    arr.versions.push(nv);
  } else {
    nv={from:K,to:toEx,day:f.day,start:f.start,end:f.end,title:f.title,color:f.color,note:f.note,deleted:!!deleted};
    arr.versions.push(nv);
  }
  arr.versions=arr.versions.filter(function(x){
    if(x===nv) return true;
    if(x.from!==null&&x.from>K){ if(toEx===null) return false; if(x.from<toEx) return false; }
    return true;
  });
  if(toEx!==null&&old&&!old.deleted){
    var hasResume=arr.versions.some(function(x){ return x!==nv&&x.from!==null&&x.from===toEx; });
    if(!hasResume){
      arr.versions.push({from:toEx,to:old.to,day:old.day,start:old.start,end:old.end,title:old.title,color:old.color,note:old.note||"",deleted:false});
    }
  }
  normalize(arr);
}
function beginChange(mode,ev,fields){
  var arr=arrById(ev.arrId);
  if(!arr) return;
  var K=weekKey(state.weekStart);
  if(mode==="delete"){
    promptScope({
      mode:"delete",K:K,
      title:"删除「"+ev.title+"」（"+WD[ev.day]+" "+fmt(ev.start)+"）？之前的周不受影响。",
      onApply:function(toEx){
        applyChange(arr,K,{day:ev.day,start:ev.start,end:ev.end,title:ev.title,color:ev.color,note:ev.note},toEx,true);
        save(); renderAll();
      }
    });
  } else {
    var changed=ev.day!==fields.day||ev.start!==fields.start||ev.end!==fields.end;
    if(!changed) return;
    promptScope({
      mode:"edit",K:K,
      title:"已把「"+ev.title+"」改为 "+WD[fields.day]+" "+fmt(fields.start)+"–"+fmt(fields.end)+"。是否同步到以后的周？",
      onApply:function(toEx){
        applyChange(arr,K,fields,toEx,false);
        save(); renderAll();
      }
    });
  }
}

function promptScope(cfg){
  var K=cfg.K, mode=cfg.mode||"edit";
  var ov=$("#overlay");
  ov.classList.remove("hidden");
  var html="<div class=\"dialog scope\" role=\"dialog\" aria-modal=\"true\">"+
    "<h3>"+(mode==="delete"?"删除范围":"同步范围")+"</h3>"+
    "<p class=\"dsub\">"+cfg.title+"</p>"+
    "<div class=\"dnote\">按 Enter 确认选择，Esc 取消/仅本周。</div>"+
    "<div class=\"opts\" id=\"scopeOpts\"></div>"+
    "<div class=\"cprev\" id=\"cPrev\"></div>"+
    "<div class=\"dfoot\">"+
      "<button class=\"btn"+(mode==="delete"?" danger":"")+"\" id=\"scCancel\">"+(mode==="delete"?"取消":"仅本周")+"</button>"+
      "<span class=\"grow\"></span>"+
      "<button class=\"btn primary\" id=\"scOk\">"+(mode==="delete"?"删除":"同步")+"</button>"+
    "</div></div>";
  ov.innerHTML=html;
  var wrap=$("#scopeOpts"), sel="1";
  function weeksVal(){
    if(sel==="all") return null;
    if(sel==="c"){ var n=parseInt($("#cnum").value,10); if(isNaN(n)||n<1)n=1; if(n>52)n=52; return n; }
    return parseInt(sel,10);
  }
  function updatePreview(){
    var n=weeksVal();
    $("#cPrev").textContent = (n===null)?("将同步到 "+labelWeek(K)+" 及以后所有周（一直持续）")
      :("将同步到 "+labelWeek(addWeeks(K,n-1))+"（含本周共 "+n+" 周，之后恢复原安排）");
  }
  function refresh(){
    wrap.querySelectorAll(".opt").forEach(function(x){
      var r=x.querySelector("input[type=radio]");
      var on=(r&&r.value===sel);
      x.classList.toggle("sel",on);
      if(r) r.checked=on;
    });
    updatePreview();
  }
  var rows=[
    {v:"1",lbl:"仅本周",sub:labelWeek(K)},
    {v:"2",lbl:"本周 + 下周",sub:"至 "+labelWeek(addWeeks(K,1))},
    {v:"3",lbl:"至未来 2 周",sub:"至 "+labelWeek(addWeeks(K,2))},
    {v:"4",lbl:"至未来 3 周",sub:"至 "+labelWeek(addWeeks(K,3))},
    {v:"all",lbl:"本周及以后所有周",sub:"一直持续，不恢复原安排"}
  ];
  function buildRow(r){
    var d=document.createElement("div");
    d.className="opt"+(sel===r.v?" sel":"");
    d.innerHTML="<input type=\"radio\" name=\"sc\" value=\""+r.v+"\""+(sel===r.v?" checked":"")+">"+
      "<span style=\"min-width:0;flex:1\"><span class=\"lbl\">"+r.lbl+"</span><span class=\"sub\">"+r.sub+"</span></span>";
    var radio=d.querySelector("input");
    radio.addEventListener("change",function(){ sel=r.v; refresh(); });
    d.addEventListener("click",function(){ sel=r.v; refresh(); });
    wrap.appendChild(d);
  }
  var custom=document.createElement("div");
  custom.className="opt";
  custom.innerHTML="<input type=\"radio\" name=\"sc\" value=\"c\">"+
    "<span style=\"min-width:0;flex:1\"><span class=\"lbl\">自定义同步周数</span>"+
    "<span class=\"sub\">含本周共 <input type=\"number\" class=\"cnum\" id=\"cnum\" min=\"1\" max=\"52\" value=\"5\"> 周（填几就同步到未来第几周为止）</span></span>";
  wrap.appendChild(custom);
  var cnum=$("#cnum");
  custom.addEventListener("click",function(){ sel="c"; refresh(); });
  cnum.addEventListener("input",function(){ sel="c"; refresh(); });
  cnum.addEventListener("click",function(ev){ ev.stopPropagation(); sel="c"; refresh(); });
  rows.forEach(buildRow);
  function closeScope(){
    ov.classList.add("hidden"); ov.innerHTML="";
    if(curEsc){ document.removeEventListener("keydown",curEsc); curEsc=null; }
  }
  function doOk(){
    var n=weeksVal();
    var toEx=(n===null)?null:addWeeks(K,n);
    closeScope();
    cfg.onApply(toEx);
  }
  function onlyThis(){
    closeScope();
    cfg.onApply(addWeeks(K,1));
  }
  $("#scOk").addEventListener("click",doOk);
  $("#scCancel").addEventListener("click",function(){
    if(mode==="delete"){ closeScope(); } else { onlyThis(); }
  });
  var esc=function(e){
    if(e.key==="Escape"){ if(mode==="delete"){ closeScope(); } else { onlyThis(); } return; }
    if(e.key==="Enter"){
      var tag=document.activeElement?document.activeElement.tagName:"";
      if(tag==="BUTTON") return;
      e.preventDefault();
      doOk();
    }
  };
  curEsc=esc;
  document.addEventListener("keydown",esc);
  attachOverlayClose(ov,function(){ if(mode==="delete"){ closeScope(); } else { onlyThis(); } });
  updatePreview();
}

const BG_STORE="myScheduleBg";
const BG_COLORS=[
  {n:"白色",c:"#ffffff"},{n:"浅灰",c:"#f1f5f9"},{n:"灰",c:"#cbd5e1"},{n:"银灰",c:"#94a3b8"},
  {n:"奶油",c:"#fef9c3"},{n:"杏色",c:"#ffedd5"},{n:"浅绿",c:"#dcfce7"},{n:"浅蓝",c:"#dbeafe"},
  {n:"天蓝",c:"#e0f2fe"},{n:"浅紫",c:"#ede9fe"},{n:"浅粉",c:"#fce7f3"},{n:"浅红",c:"#fecaca"},
  {n:"石板",c:"#475569"},{n:"深蓝",c:"#1e3a8a"},{n:"墨绿",c:"#14532d"},{n:"深灰",c:"#111827"}
];
let bgCur={type:"none",value:"",shade:0.35};   /* 表格背景 */
let pgCur={type:"none",value:"",shade:0.35};   /* 网页背景 */
function normBg(o){
  if(!o||typeof o!=="object") return {type:"none",value:"",shade:0.35};
  return {type:(o.type==="url"?"url":(o.type==="color"?"color":"data")),value:o.value||"",shade:(typeof o.shade==="number"?o.shade:0.35)};
}
function loadBg(){
  try{
    var raw=localStorage.getItem(BG_STORE);
    if(raw){
      var o=JSON.parse(raw);
      if(o&&o.t&&typeof o.t.type!=="undefined"){ bgCur=normBg(o.t); pgCur=normBg(o.p); }
      else { bgCur=normBg(o); pgCur={type:"none",value:"",shade:0.35}; }
    }
  }catch(e){}
  applyBg();
  applyPageBg();
}
function applyBg(){
  var body=document.body;
  var board=document.querySelector(".board-wrap");
  var ov=$("#boardBgOverlay");
  var has=(bgCur.type!=="none"&&bgCur.value);
  body.classList.toggle("bg-on",has);
  if(board){
    if(bgCur.type==="color"){ board.style.backgroundColor=bgCur.value; board.style.backgroundImage=""; }
    else if(has){ board.style.backgroundImage="url('"+bgCur.value+"')"; board.style.backgroundSize="cover"; board.style.backgroundPosition="center"; }
    else { board.style.backgroundImage=""; board.style.backgroundColor=""; board.style.backgroundSize=""; board.style.backgroundPosition=""; }
  }
  if(ov){
    if(has&&bgCur.type!=="color"){
      var a=Math.max(0,Math.min(0.85,bgCur.shade));
      ov.style.display="block"; ov.style.background="rgba(255,255,255,"+a+")";
    } else { ov.style.display="none"; ov.style.background=""; }
  }
}
function applyPageBg(){
  var body=document.body;
  var sh=$("#bgShade");
  var has=(pgCur.type!=="none"&&pgCur.value);
  body.classList.toggle("pg-bg",has);
  if(pgCur.type==="color"){
    body.style.backgroundColor=pgCur.value;
    body.style.backgroundImage="none";
    body.style.backgroundAttachment="";
  } else if(has){
    body.style.backgroundColor="#eef1f7";
    body.style.backgroundImage="url('"+pgCur.value+"')";
    body.style.backgroundSize="cover";
    body.style.backgroundPosition="center";
    body.style.backgroundAttachment="fixed";
  } else {
    body.style.backgroundColor="";
    body.style.backgroundImage="none";
    body.style.backgroundSize="";
    body.style.backgroundPosition="";
    body.style.backgroundAttachment="";
  }
  if(sh){
    if(pgCur.type!=="color"&&has){
      var a=Math.max(0,Math.min(0.85,pgCur.shade));
      sh.style.background="rgba(255,255,255,"+a+")";
    } else { sh.style.background="transparent"; }
  }
}
function saveBg(){
  try{ localStorage.setItem(BG_STORE,JSON.stringify({t:bgCur,p:pgCur})); localChanged(); }
  catch(e){ alert("图片较大，无法保存到浏览器存储（建议 5MB 以内的图片）。当前仍可使用，但刷新后会恢复默认背景。"); }

/* ---------- 导出为图片（仅表格内容） ---------- */
function rrPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx,text,maxW){
  var lines=[], cur="";
  for(var i=0;i<text.length;i++){
    var ch=text.charAt(i);
    var test=cur+ch;
    if(ctx.measureText(test).width>maxW&&cur){ lines.push(cur); cur=ch; }
    else cur=test;
  }
  if(cur) lines.push(cur);
  return lines;
}
function drawCover(ctx,img,W,H){
  var iw=img.width||img.naturalWidth, ih=img.height||img.naturalHeight;
  if(!iw||!ih) return;
  var r=Math.max(W/iw,H/ih);
  var dw=iw*r, dh=ih*r;
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
}
function downloadCanvas(cv,name){
  try{
    var a=document.createElement("a");
    a.download=name;
    a.href=cv.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert("导出失败："+e.message); }
}function exportImage(mode){
  mode=(mode==="clipboard")?"clipboard":"download";
  var key=weekKey(state.weekStart);
  var evs=weekEvents(key).filter(function(x){ return !hidden[key+"|"+x.arrId]; });
  var gutter=70, header=64, colW=150, hours=(DAY_END-DAY_START)/60;
  var W=gutter+7*colW, H=header+hours*PX;
  var scale=2;
  var cv=document.createElement("canvas");
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  var ctx=cv.getContext("2d");
  ctx.scale(scale,scale);
  var useBg=(bgCur.type==="data"&&bgCur.value);
  function render(img){
    ctx.fillStyle=(bgCur.type==="color")?bgCur.value:"#ffffff";
    ctx.fillRect(0,0,W,H);
    var hasImg=!!img;
    if(hasImg){
      drawCover(ctx,img,W,H);
      var wsh=Math.max(0,Math.min(0.85,bgCur.shade));
      ctx.fillStyle="rgba(255,255,255,"+wsh+")";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle="rgba(255,255,255,.5)";
      ctx.fillRect(0,0,W,header);
      ctx.fillRect(0,0,gutter,H);
    }
    var now=new Date();
    for(var i=0;i<7;i++){
      var d=addDays(state.weekStart,i);
      if(sameDay(d,now)&&isCurrentWeek()){
        ctx.fillStyle=hasImg?"rgba(79,110,242,.12)":"#f4f6ff";
        ctx.fillRect(gutter+i*colW,header,colW,H-header);
      }
    }
    var glA=(Math.max(0,Math.min(100,vset.grid))/100)*0.5;
    var gl="rgba(148,163,184,"+glA+")";
    var gl2="rgba(148,163,184,"+(glA*0.8)+")";
    var font=VFONTS[vset.font]||VFONTS.system;
    ctx.lineWidth=1;
    for(var i=0;i<=7;i++){
      var x=gutter+i*colW;
      ctx.strokeStyle=(i===0||i===7)?gl:gl2;
      ctx.beginPath(); ctx.moveTo(x,header); ctx.lineTo(x,H); ctx.stroke();
    }
    for(var k=1;k<=hours;k++){
      var y=header+k*PX;
      ctx.strokeStyle=gl;
      ctx.beginPath(); ctx.moveTo(gutter,y); ctx.lineTo(W,y); ctx.stroke();
    }
    ctx.strokeStyle="rgba(148,163,184,"+Math.min(0.6,glA*2)+")";
    ctx.beginPath(); ctx.moveTo(gutter,header); ctx.lineTo(W,header); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gutter,H); ctx.lineTo(W,H); ctx.stroke();
    ctx.textAlign="center";
    var wdSize=Math.round(vset.size+1), dtSize=vset.size;
    for(var i=0;i<7;i++){
      var cx=gutter+i*colW+colW/2;
      var d=addDays(state.weekStart,i);
      ctx.fillStyle=hasImg?"#3c4a6b":"#42506b";
      ctx.font="700 "+wdSize+"px "+font;
      ctx.fillText(WD[i],cx,26);
      var dateTxt=dateLabel(d);
      ctx.font="700 "+dtSize+"px "+font;
      var tw=ctx.measureText(dateTxt).width;
      if(sameDay(d,now)&&isCurrentWeek()){
        var bw=tw+16, bh=24;
        var g=ctx.createLinearGradient(cx-bw/2,34,cx+bw/2,58);
        g.addColorStop(0,"#4f6ef2"); g.addColorStop(1,"#8b5cf6");
        ctx.fillStyle=g;
        rrPath(ctx,cx-bw/2,34,bw,bh,bh/2); ctx.fill();
        ctx.fillStyle="#ffffff";
      } else {
        ctx.fillStyle="#39415a";
      }
      ctx.fillText(dateTxt,cx,49);
    }
    ctx.textAlign="right";
    ctx.fillStyle=hasImg?"#374151":"#475569";
    ctx.font="700 "+Math.max(10,vset.size-1)+"px "+font;
    for(var k=0;k<hours;k++){
      ctx.fillText(timeText(DAY_START+k*60),gutter-9,header+(k*PX+2)+vset.size);
    }
    ctx.textAlign="left";
    for(var j=0;j<evs.length;j++){
      var ev=evs[j];
      var x0=gutter+ev.day*colW;
      var y0=header+evTop(ev.start);
      var durPx=(ev.end-ev.start)*PX/60;
      var hh=Math.max(30,durPx-3);
      ctx.fillStyle=colColor(ev.color);
      rrPath(ctx,x0+6,y0,colW-12,hh,8); ctx.fill();
      var padX=12;
      var innerW=colW-36;
      var cardFam=(vset.cardFont&&vset.cardFont!=="inherit")?(VFONTS[vset.cardFont]||font):font;
      function textPos(align){
        if(align==="center") return {ta:"center",x:x0+6+(colW-12)/2};
        if(align==="right") return {ta:"right",x:x0+6+(colW-12)-padX};
        return {ta:"left",x:x0+6+padX};
      }
      function drawLine(txt,baseY,align,weight,size,color,italic,under,shadow){
        var tp=textPos(align);
        ctx.textAlign=tp.ta;
        ctx.font=(italic?"italic ":"")+weight+" "+size+"px "+cardFam;
        ctx.fillStyle=color||"#ffffff";
        if(shadow){ ctx.shadowColor="rgba(0,0,0,.3)"; ctx.shadowBlur=1; ctx.shadowOffsetY=1; }
        ctx.fillText(txt,tp.x,baseY);
        ctx.shadowColor="transparent"; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
        if(under){
          var w=ctx.measureText(txt).width;
          var ux=(tp.ta==="center")?(tp.x-w/2):((tp.ta==="right")?(tp.x-w):tp.x);
          ctx.fillRect(ux,baseY+2,w,1);
        }
      }
      if(hh>=54){
        var timeTxt=timeText(ev.start)+" – "+timeText(ev.end);
        var baseFontIt=vset.tItalic?"italic ":"";
        ctx.font=baseFontIt+(vset.tBold?"700":"400")+" "+vset.tSize+"px "+cardFam;
        var lines=wrapText(ctx,ev.title||"（未命名安排）",innerW);
        var lineH=Math.round(vset.tSize+4);
        var timeH=Math.round(vset.mSize+3);
        var maxLines=Math.max(1,Math.floor((hh-16-timeH-7)/lineH));
        lines=lines.slice(0,maxLines);
        var blockH=lines.length*lineH+7+timeH;
        var top=y0+Math.max(3,(hh-blockH)/2);
        var cursorY=top;
        ctx.fillStyle=vset.tColor||"#ffffff";
        for(var li=0;li<lines.length;li++){
          drawLine(lines[li],cursorY+Math.ceil(vset.tSize)+1,vset.tAlign||"left",vset.tBold?"700":"400",vset.tSize,vset.tColor||"#ffffff",vset.tItalic,vset.tUnder,vset.tShadow);
          cursorY+=lineH;
        }
        cursorY+=7;
        drawLine(timeTxt,cursorY+Math.ceil(vset.mSize)+1,vset.mAlign||"left",vset.mBold?"700":"500",vset.mSize,vset.mColor||"#ffffff",vset.mItalic,vset.mUnder,vset.mShadow);
      } else {
        var one=wrapText(ctx,ev.title||"（未命名安排）",innerW).slice(0,1);
        drawLine(one[0]||"",y0+hh/2+Math.ceil(vset.tSize*0.4),vset.tAlign||"left",vset.tBold?"700":"400",vset.tSize,vset.tColor||"#ffffff",vset.tItalic,vset.tUnder,vset.tShadow);
      }
    }
    var fname="日程表_第"+isoWeek(parseKey(key))+"周.png";
    if(mode==="clipboard"&&navigator.clipboard&&window.ClipboardItem){
      cv.toBlob(function(blob){
        try{
          navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(function(){
            showToast("✅ 已复制图片，打开微信聊天框直接粘贴发送即可");
          }).catch(function(){
            downloadCanvas(cv,fname);
            showToast("⚠️ 浏览器不允许直接复制，已改为下载图片，发送时选择该图片");
          });
        }catch(err){
          downloadCanvas(cv,fname);
          showToast("⚠️ 浏览器不允许直接复制，已改为下载图片，发送时选择该图片");
        }
      },"image/png");
    } else {
      downloadCanvas(cv,fname);
      if(mode==="clipboard") showToast("⚠️ 当前浏览器不支持直接复制，已改为下载图片");
    }
  }
  if(useBg){
    var im=new Image();
    im.onload=function(){ render(im); };
    im.onerror=function(){ render(null); };
    im.src=bgCur.value;
  } else {
    render(null);
  }
}

function updateNowLine(){

/* ---------- 大标题（可自定义修改） ---------- */
const TITLE_KEY="myScheduleTitle";
let titleEditing=false, titleLast="";
function initTitle(){
  try{
    var v=localStorage.getItem(TITLE_KEY);
    if(v&&v.trim()) $("#mainTitle").textContent=v.trim();
  }catch(e){}
}
function startTitleEdit(){
  if(titleEditing) return;
  var el=$("#mainTitle");
  titleEditing=true; titleLast=el.textContent;
  el.contentEditable="true";
  el.classList.add("editing");
  el.focus();
  try{
    var r=document.createRange(); r.selectNodeContents(el);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
}
function endTitleEdit(){
  var el=$("#mainTitle");
  titleEditing=false;
  el.contentEditable="false";
  el.classList.remove("editing");
  try{ window.getSelection().removeAllRanges(); }catch(e){}
}
function commitTitle(){
  var el=$("#mainTitle");
  var txt=(el.textContent||"").replace(/\s+/g," ").trim();
  if(!txt) txt="我的每日工作日程表";
  el.textContent=txt;
  endTitleEdit();
  try{ localStorage.setItem(TITLE_KEY,txt); }catch(e){}
  localChanged();
}
function bindTitle(){
  var el=$("#mainTitle"), btn=$("#mtEdit");
  btn.addEventListener("click",function(){
    if(titleEditing){ commitTitle(); }
    else { startTitleEdit(); }
  });
  el.addEventListener("dblclick",function(){ startTitleEdit(); });
  el.addEventListener("keydown",function(e){
    if(!titleEditing) return;
    if(e.key==="Enter"){ e.preventDefault(); commitTitle(); }
    else if(e.key==="Escape"){ el.textContent=titleLast; endTitleEdit(); }
  });
  el.addEventListener("blur",function(){ if(titleEditing) commitTitle(); });
}
/* ---------- 数据导出 / 导入（跨设备） ---------- */
function collectData(){
  return {v:1,exportedAt:new Date().toISOString(),modifiedAt:Number(localStorage.getItem(LASTCHANGE_KEY)||0),title:($("#mainTitle").textContent||""),arrs:state.arrs,view:vset,hidden:hidden,bg:{t:bgCur,p:pgCur}};
}
function exportDataFile(){
  try{
    var blob=new Blob([JSON.stringify(collectData())],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="日程表数据_"+fmtKey(new Date())+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
    showToast("✅ 已导出数据文件，可发到手机后导入");
  }catch(e){ alert("导出失败："+e.message); }
}
function applyImportedData(d,silent){
  if(!d||!Array.isArray(d.arrs)){ alert("数据格式不正确，无法导入。"); return false; }
  if(d.arrs.length===0&&!confirm("导入的数据里没有日程，仍要导入吗？")) return false;
  cloudApplying=true;
  state.arrs=d.arrs;
  try{ localStorage.setItem(LASTCHANGE_KEY,String(d.modifiedAt||Date.now())); }catch(e){}
  sanitizeData();
  if(d.view) vset=Object.assign({},vset,d.view);
  if(d.bg){ bgCur=normBg(d.bg.t); pgCur=normBg(d.bg.p); }
  hidden=d.hidden||{};
  if(d.title){ $("#mainTitle").textContent=d.title; try{ localStorage.setItem(TITLE_KEY,d.title); }catch(e){} }
  save(); saveView(); saveBg(); saveHidden();
  applyView(); applyBg(); applyPageBg(); renderAll();
  cloudApplying=false;
  if(!silent) showToast("✅ 数据已导入，日程已更新");
  return true;
}
function openImportDialog(){

    "<div class=\"dnote\" id=\"impNote\"></div>"+

/* ---------- 云同步（GitHub） ---------- */
const CLOUD_KEY="myScheduleCloud";
const LASTCHANGE_KEY="myScheduleLastChange";
let cloudCfg={owner:"lichangfeng",repo:"my-schedule",branch:"main",path:"schedule-data.json",token:"",autoPull:false,autoPush:false,lastSync:""};
let cloudReady=false, cloudTimer=null, cloudApplying=false;
function loadCloudCfg(){
  try{
    var raw=localStorage.getItem(CLOUD_KEY);
    if(raw){ var o=JSON.parse(raw); if(o){ for(var k in o){ if(o[k]!==undefined) cloudCfg[k]=o[k]; } } }
  }catch(e){}
}
function saveCloudCfg(){ try{ localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudCfg)); }catch(e){} }
function localChanged(){ if(!cloudApplying){ try{ localStorage.setItem(LASTCHANGE_KEY,String(Date.now())); }catch(e){} } cloudTouch(); }
function cloudConfigured(){ return !!(cloudCfg.owner&&cloudCfg.repo&&cloudCfg.token); }
function b64Encode(str){ var bytes=new TextEncoder().encode(str),bin="",chunk=0x8000; for(var i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk)); } return btoa(bin); }
function b64Decode(b64){ var bin=atob(String(b64).replace(/\s/g,"")),bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function cloudUrl(){ return "https://api.github.com/repos/"+encodeURIComponent(cloudCfg.owner)+"/"+encodeURIComponent(cloudCfg.repo)+"/contents/"+encodeURIComponent(cloudCfg.path)+(cloudCfg.branch?("?ref="+encodeURIComponent(cloudCfg.branch)):""); }
function cloudHeaders(){ var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}; if(cloudCfg.token) h["Authorization"]="Bearer "+cloudCfg.token; return h; }
function cloudErr(r){ return r.text().then(function(t){ var m="GitHub 返回 "+r.status; try{ var j=JSON.parse(t); if(j&&j.message) m+="："+j.message; }catch(e){ m+="："+String(t).slice(0,140); } throw new Error(m); }); }
function cloudPull(silent,force){
  if(!cloudConfigured()){ if(!silent) alert("请先在云同步里填写用户名、仓库名和 Token。"); return Promise.reject(new Error("未配置")); }
  return fetch(cloudUrl(),{headers:cloudHeaders()}).then(function(r){
    if(r.status===404) throw new Error("云端还没有数据，请先在本机点“上传本机数据”。");
    if(!r.ok) return cloudErr(r);
    return r.json();
  }).then(function(j){
    if(j&&j.download_url&&(!j.content||j.encoding!=="base64")){
      return fetch(j.download_url,{cache:"no-store"}).then(function(r){
        if(!r.ok) throw new Error("下载云端数据失败："+r.status);
        return r.text();
      });
    }
    return b64Decode(j.content||"");
  }).then(function(raw){
    if(!raw||!raw.trim()) throw new Error("云端的数据文件是空的。请到有数据的那台设备点“上传本机”覆盖它。");
    var data;
    try{ data=JSON.parse(raw); }catch(e){ throw new Error("云端数据格式不正确（可能被手动改过）。请到有数据的那台设备点“上传本机”覆盖。"); }
    var remoteT=Number(data.modifiedAt||0);
    var localT=Number(localStorage.getItem(LASTCHANGE_KEY)||0);
    if(!force&&remoteT>0&&localT>remoteT+120000){
      if(cloudCfg.autoPush) cloudPush(true).catch(function(){});
      if(!silent) showToast("本机数据比云端新，已保留本机数据");
      return data;
    }
    if(!applyImportedData(data,true)) throw new Error("云端数据内容无效，已跳过（本地数据没有改动）");
    cloudCfg.lastSync=new Date().toISOString(); saveCloudCfg();
    if(!silent) showToast("☁️ 已从云端下载同步");
    return data;
  }).catch(function(e){ if(!silent) alert("云同步失败："+e.message); throw e; });
}
function cloudPush(silent){
  if(!cloudConfigured()){ if(!silent) alert("请先在云同步里填写用户名、仓库名和 Token。"); return Promise.reject(new Error("未配置")); }
  var payload={message:"更新日程数据 "+(new Date().toLocaleString("zh-CN")),content:b64Encode(JSON.stringify(collectData())),branch:cloudCfg.branch||"main"};
  return fetch(cloudUrl(),{headers:cloudHeaders()}).then(function(r){
    if(r.ok) return r.json();
    if(r.status===404) return null;
    if(r.status===401) throw new Error("Token 无效或已过期（401）");
    if(r.status===403) throw new Error("Token 权限不足（403）：请给 public_repo 或 Contents 读写权限");
    return cloudErr(r);
  }).catch(function(e){
    if(e&&e.message&&(e.message.indexOf("Token")>=0||e.message.indexOf("GitHub 返回")>=0)) throw e;
    throw new Error("连不上 api.github.com（网络问题）");
  }).then(function(j){
    if(j&&j.sha) payload.sha=j.sha;
    return fetch(cloudUrl(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},cloudHeaders()),body:JSON.stringify(payload)});
  }).then(function(r){ if(!r.ok) return cloudErr(r); cloudCfg.lastSync=new Date().toISOString(); saveCloudCfg(); if(!silent) showToast("☁️ 已上传到云端"); })
    .catch(function(e){ if(!silent) alert("上传失败："+e.message); throw e; });
}
function cloudTest(){
  if(!cloudConfigured()){ $("#clNote").textContent="⚠️ 请先填写用户名、仓库名和 Token"; return; }
  $("#clNote").textContent="测试中…";
  fetch("https://api.github.com/user",{headers:cloudHeaders()}).then(function(r){
    if(r.status===401) throw new Error("Token 无效或已过期（401），请重新生成");
    if(!r.ok) return cloudErr(r);
    return r.json();
  }).then(function(u){
    return fetch("https://api.github.com/repos/"+encodeURIComponent(cloudCfg.owner)+"/"+encodeURIComponent(cloudCfg.repo),{headers:cloudHeaders()}).then(function(r){
      if(r.status===404) throw new Error("找不到仓库 "+cloudCfg.owner+"/"+cloudCfg.repo+"（仓库名是否正确？）");
      if(!r.ok) return cloudErr(r);
      return r.json().then(function(repo){ return {u:u,repo:repo}; });
    });
  }).then(function(res){
    var perms=res.repo.permissions||{};
    var canWrite=!!(perms.push||perms.admin||perms.maintain);
    $("#clNote").textContent="✔ Token 属于 "+res.u.login+"；仓库可读"+(canWrite?"、可写入":"、但没有写入权限（需要 public_repo 或 Contents: Read and write）");
  }).catch(function(e){
    var m=e&&e.message?e.message:String(e);
    if(m.indexOf("Failed to fetch")>=0||m.indexOf("NetworkError")>=0) m="连不上 api.github.com（网络被挡或需要用 Edge/Chrome 打开网页版）";
    $("#clNote").textContent="⚠️ "+m;
  });
}
function cloudTouch(){ if(!cloudReady||cloudApplying||!cloudCfg.autoPush||!cloudConfigured()) return; if(cloudTimer) clearTimeout(cloudTimer); cloudTimer=setTimeout(function(){ cloudPush(true).catch(function(){}); },800); }
function openCloudDialog(){
  var ov=$("#overlay"); ov.classList.remove("hidden");
  var html="<div class=\"dialog\" role=\"dialog\" aria-modal=\"true\"><h3>云同步（GitHub）</h3>"+
    "<p class=\"dsub\">数据保存在你自己的 GitHub 仓库里；手机和电脑各填一次 Token 即可同步。<br>⚠️ 请在<b>网页版</b>（lichangfeng.github.io/my-schedule）里设置，不要在电脑本机 html 文件里设置，否则浏览器会挡住同步。Token 只存在本机浏览器。</p>"+
    "<div class=\"field\"><label>GitHub 用户名</label><input type=\"text\" id=\"clOwner\"></div>"+
    "<div class=\"field\"><label>仓库名</label><input type=\"text\" id=\"clRepo\"></div>"+
    "<div class=\"field\"><label>分支</label><input type=\"text\" id=\"clBranch\"></div>"+
    "<div class=\"field\"><label>数据文件名</label><input type=\"text\" id=\"clPath\"></div>"+
    "<div class=\"field\"><label>访问令牌 Token</label><input type=\"password\" id=\"clToken\" placeholder=\"github_pat_... 或 ghp_...\"></div>"+
    "<div class=\"field\"><label class=\"rad\" style=\"margin:0 0 6px\"><input type=\"checkbox\" id=\"clAutoPull\">打开网页时自动从云端下载</label>"+
    "<label class=\"rad\" style=\"margin:0\"><input type=\"checkbox\" id=\"clAutoPush\">修改后自动上传到云端</label></div>"+
    "<div class=\"dnote\" id=\"clNote\"></div>"+
    "<div class=\"dfoot\"><button class=\"btn\" id=\"clSave\">保存设置</button><button class=\"btn\" id=\"clTest\">🔍 测试连接</button><span class=\"grow\"></span>"+
    "<button class=\"btn\" id=\"clPull\">⬇ 下载云端</button><button class=\"btn primary\" id=\"clPush\">⬆ 上传本机</button><button class=\"btn\" id=\"clClose\">关闭</button></div></div>";
  ov.innerHTML=html;
  $("#clOwner").value=cloudCfg.owner||""; $("#clRepo").value=cloudCfg.repo||"";
  $("#clBranch").value=cloudCfg.branch||"main"; $("#clPath").value=cloudCfg.path||"schedule-data.json";
  $("#clToken").value=cloudCfg.token||""; $("#clAutoPull").checked=!!cloudCfg.autoPull; $("#clAutoPush").checked=!!cloudCfg.autoPush;
  function note(msg,ok){ var n=$("#clNote"); n.textContent=msg; n.style.color=ok?"#059669":""; }
  function readForm(){ cloudCfg.owner=$("#clOwner").value.trim(); cloudCfg.repo=$("#clRepo").value.trim(); cloudCfg.branch=$("#clBranch").value.trim()||"main"; cloudCfg.path=$("#clPath").value.trim()||"schedule-data.json"; cloudCfg.token=$("#clToken").value.trim(); cloudCfg.autoPull=$("#clAutoPull").checked; cloudCfg.autoPush=$("#clAutoPush").checked; }
  function closeCloud(){ ov.classList.add("hidden"); ov.innerHTML=""; if(curEsc){document.removeEventListener("keydown",curEsc); curEsc=null;} }
  $("#clSave").addEventListener("click",function(){ readForm(); saveCloudCfg(); note("✔ 已保存设置到本机，可点“上传本机”或“下载云端”",true); });
  $("#clTest").addEventListener("click",function(){ readForm(); saveCloudCfg(); cloudTest(); });
  $("#clPull").addEventListener("click",function(){
    readForm(); saveCloudCfg();
    if(!confirm("将从云端下载并覆盖本机当前数据，确定吗？")) return;
    note("正在下载…");
    cloudPull(false,true).then(function(){ closeCloud(); }).catch(function(){});
  });
  $("#clPush").addEventListener("click",function(){ readForm(); saveCloudCfg(); note("正在上传…"); cloudPush(false).then(function(){ closeCloud(); }).catch(function(){}); });
  $("#clClose").addEventListener("click",closeCloud);
  var esc=function(e){ if(e.key==="Escape") closeCloud(); };
  curEsc=esc; document.addEventListener("keydown",esc);
  attachOverlayClose(ov,closeCloud);
}
